
name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: PixelFit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify project directory
        run: |
          echo "Current directory:"
          pwd
          echo "Files:"
          ls -la
          echo "Checking Gradle settings:"
          test -f settings.gradle.kts || test -f settings.gradle

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelFit-APK
          path: PixelFit/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
